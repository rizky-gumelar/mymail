name: Deploy Laravel to Hosting

on:
  push:
    branches:
      - main  # Ganti dengan branch utama kamu

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: /../../mail.linkup.my.id/ # Sesuaikan path

      # - name: Run Laravel Commands
      #   run: |
      #     curl http://mail.linkup.my.id/artisan.php?command=config:cache
      #     curl http://mail.linkup.my.id/artisan.php?command=migrate
